name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Build từng service để kiểm tra lỗi code
      - name: Build xe-service
        run: mvn clean package -DskipTests
        working-directory: ./xe-service

      - name: Build khach-service
        run: mvn clean package -DskipTests
        working-directory: ./khach-service

      - name: Build hopdong-service
        run: mvn clean package -DskipTests
        working-directory: ./hopdong-service

      - name: Build bangiao-service
        run: mvn clean package -DskipTests
        working-directory: ./bangiao-service

      - name: Build gateway
        run: mvn clean package -DskipTests
        working-directory: ./gateway

      # Đăng nhập vào GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lấy 7 ký tự đầu của commit làm tag
      - name: Extract short commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Build và Push từng image lên ghcr.io
      - name: Build and push xe-service
        uses: docker/build-push-action@v5
        with:
          context: ./xe-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/xe-service:${{ steps.vars.outputs.sha_short }}

      - name: Build and push khach-service
        uses: docker/build-push-action@v5
        with:
          context: ./khach-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/khach-service:${{ steps.vars.outputs.sha_short }}

      - name: Build and push hopdong-service
        uses: docker/build-push-action@v5
        with:
          context: ./hopdong-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/hopdong-service:${{ steps.vars.outputs.sha_short }}

      - name: Build and push bangiao-service
        uses: docker/build-push-action@v5
        with:
          context: ./bangiao-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/bangiao-service:${{ steps.vars.outputs.sha_short }}

      - name: Build and push gateway
        uses: docker/build-push-action@v5
        with:
          context: ./gateway
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/gateway:${{ steps.vars.outputs.sha_short }}